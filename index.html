            html, body {
                background: #ffffff !important;
                color: #000000 !important;
                font-family: "Times New Roman", Times, serif !important;
                font-size: 13pt !important;
                line-height: 1.45 !important;

            .print-only {
                display: block !important;
            }
            /* Full layout resets for print */
            #root, main, .min-h-screen, .container, .p-8 {

                border: none !important;
                box-shadow: none !important;
                background: transparent !important;
                width: auto !important;
                max-width: none !important;

                font-family: "Times New Roman", Times, serif !important;

            }
            /* Question alignment print styles */
            .question-block {

                margin-bottom: 1.25rem !important;
            }
            /* Math standard sizes for printing */
            .katex {
                font-size: 12pt !important;
            }
            .katex-display {
                margin: 0.5rem 0 !important;
                padding: 0 !important;
                page-break-inside: avoid !important;
            }
            /* Standardized exam layout elements */
            .student-info-box {
                border: 1px solid #000000 !important;
                padding: 12px !important;
                margin-bottom: 1.5rem !important;
                font-family: "Times New Roman", Times, serif !important;
                font-size: 11pt !important;
                line-height: 1.6 !important;
            }
            /* Align choices inline or in simple neat list */
            .choices {
                display: block !important;
                margin-left: 1.5rem !important;
                margin-bottom: 0.75rem !important;
            }
            /* Tables format for exam matrices and answers */
            table {
                width: 100% !important;
                border-collapse: collapse !important;
                font-size: 11pt !important;
                margin: 1rem 0 !important;
                page-break-inside: auto !important;
            }
            tr {
                page-break-inside: avoid !important;
            }
            th, td {
                border: 1px solid #000000 !important;
                padding: 6px !important;
                color: #000000 !important;
                background: transparent !important;
                word-wrap: break-word !important;
                overflow-wrap: break-word !important;
            }
            th {
                font-weight: bold !important;
                text-align: center !important;
                background-color: #f3f4f6 !important;
            }
            .page-break {
                page-break-before: always !important;
                break-before: page !important;
            }
            /* SVG figures */
            .figure-container svg {
                max-width: 80% !important;
                margin: 1rem auto !important;
                page-break-inside: avoid !important;
            }
        }
        .print-only { display: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        /* STEM Optimization & KaTeX Fixes */
        .katex { 
            font-size: 1.05em; 
            line-height: 1.2; 
            white-space: normal; 
        }
        
        .katex-display { 
            overflow-x: auto !important; 
            overflow-y: hidden !important; 
            padding: 1.2rem 0;
            margin: 1.5rem 0;
            text-align: center;
            scrollbar-width: thin;
        }

        /* Tinh chỉnh khoảng cách cho inline math */
        .math-inline-wrapper {
            display: inline-block;
            padding: 0 0.25rem;
            vertical-align: middle;
            line-height: 1.4;
        }

        /* Tinh chỉnh khoảng cách cho block math */
        .math-block-wrapper {
            margin: 1.2rem 0;
            display: block;
            clear: both;
        }
        
        .figure-container svg {
            max-width: 100%;
            height: auto;
            margin: 1.5rem auto;
            display: block;
        }
        
        .latex-container {
            line-height: 1.7;
        }

        /* KaTeX Error Handling CSS */
        .katex-error {
            color: #e11d48 !important; /* Rose 600 */
            background-color: #fff1f2; /* Rose 50 */
            border: 1px solid #fecaca; /* Rose 200 */
            padding: 2px 8px;
            border-radius: 6px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 0.85em;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin: 0 2px;
            font-weight: 500;
        }

        .katex-error::before {
            content: "⚠️ Công thức lỗi:";
            font-weight: 800;
            font-family: 'Inter', sans-serif;
            font-size: 0.65rem;
            text-transform: uppercase;
            background: #e11d48;
            color: white;
            padding: 1px 4px;
            border-radius: 3px;
            white-space: nowrap;
        }
